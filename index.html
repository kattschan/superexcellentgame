<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTuGBS</title>
    <style>
        :root {
            --bg-color: #0f111a; /* Dark server background */
            --card-bg: #1f2335;
            --text-main: #e0e6ed;
            --text-muted: #6c7393;
            --accent-green: #27d796; /* Status indicator */
            --accent-blue: #21c7ef; /* Links */
            --font-mono: 'Courier New', Courier, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        /* Header Styles */
        header {
            width: 100%;
            max-width: 900px;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--text-muted);
            padding-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: end;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            font-family: var(--font-mono);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Server Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent-green);
            background: rgba(39, 215, 150, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            border: 1px solid rgba(39, 215, 150, 0.2);
        }
        .status-dot {
            height: 8px;
            width: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* Build Table Styles */
        .build-container {
            width: 100%;
            max-width: 900px;
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: rgba(0,0,0,0.2);
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid #2f354d;
        }

        td {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid #2f354d;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: rgba(255,255,255,0.03);
        }

        /* Column Specifics */
        .project-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .version-tag {
            font-family: var(--font-mono);
            background-color: #2f354d;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .timestamp {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .action-link a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
            border: 1px solid var(--accent-blue);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .action-link a:hover {
            background-color: var(--accent-blue);
            color: var(--bg-color);
        }

        footer {
            margin-top: 3rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-family: var(--font-mono);
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1>KTuGBS</h1>
        <div class="subtitle">unified Game Builds Server</div>
    </div>
</header>

<main class="build-container">
    <table>
        <thead>
        <tr>
            <th>Project Name</th>
            <th>Version</th>
            <th>Last Modified</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td class="project-name">APUSHgame</td>
            <td><span class="version-tag">v0.0.0</span></td>
            <td class="timestamp">Wed, Jan 14, 2026<br>04:32 AM</td>
            <td class="action-link">
                <a href="/games/apushgame/index.html">Launch Build</a>
            </td>
        </tr>

        </tbody>
    </table>
</main>

<footer>
    &copy; 2026 KTuGBS. Authorized Access Only.
</footer>

</body>
</html>
